<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>渭水五中校园论坛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
body{background:#f5f7fa;color:#222;line-height:1.55;}

/* 顶部用户栏 */
.user-bar{
    max-width:960px;
    margin:14px auto 0;
    text-align:right;
    font-size:13px;
    color:#666;
}
.user-bar a{
    color:#4a6fa5;
    text-decoration:none;
    margin-left:12px;
}
.user-bar a:hover{text-decoration:underline;}

/* 头部标题+搜索 */
.header-wrap{
    max-width:960px;
    margin:6px auto 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 20px;
    background:#ffffff;
    border:1px solid #d9dfe6;
    border-bottom:none;
}
.site-title h1{
    font-size:22px;
    color:#33475b;
    font-weight:600;
}
.site-desc{font-size:13px;color:#777;margin-top:4px;}
.head-search{display:flex;gap:6px;}
.head-search input{
    width:260px;
    padding:7px 10px;
    border:1px solid #c9d1da;
    border-radius:4px;
    outline:none;
    font-size:14px;
    background:#fafbfc;
}
.head-search button{
    padding:7px 14px;
    background:#5b7a99;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

/* 主体：左导航 + 右内容 */
.main-container{
    max-width:960px;
    margin:0 auto 30px;
    display:grid;
    grid-template-columns:200px 1fr;
    gap:0;
}

/* 左侧边栏 */
.left-sidebar{
    background:#ffffff;
    border:1px solid #d9dfe6;
    border-right:none;
    padding:16px 12px;
}
.side-block{margin-bottom:20px;}
.side-block h3{
    font-size:14px;
    color:#33475b;
    padding-bottom:6px;
    border-bottom:1px solid #e4e8ed;
    margin-bottom:10px;
}
.nav-item{
    padding:7px 6px;
    cursor:pointer;
    font-size:14px;
    color:#444;
    border-radius:3px;
}
.nav-item:hover{background:#eef2f7;}
.nav-item.active{background:#dce4ee;color:#2f5572;font-weight:500;}
.online-stat{
    font-size:12px;
    color:#777;
    padding-top:10px;
    border-top:1px dashed #e4e8ed;
}

/* 右侧主内容区 */
.content-area{
    background:#ffffff;
    border:1px solid #d9dfe6;
    padding:16px;
}

/* Banner 加大 */
.banner{
    width:100%;
    height:180px;
    border:1px solid #cfd7e0;
    border-radius:4px;
    margin-bottom:14px;
    overflow:hidden;
}
.banner img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.alert-bar{
    background:#f1f4f8;
    border:1px solid #d9e0e8;
    border-radius:4px;
    padding:8px 12px;
    font-size:13px;
    color:#445566;
    margin-bottom:14px;
}
.search-tip{
    color:#b54747;
    font-size:14px;
    margin-bottom:8px;
    display:none;
}

/* 帖子卡片：统一高度基线 */
.post-card{
    border:1px solid #e4e8ed;
    border-radius:4px;
    padding:14px;
    margin-bottom:10px;
    cursor:pointer;
    background:#fcfdfd;
    transition:background 0.15s;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    min-height:78px;
}
.post-card:hover{background:#f4f7fb;}
.post-head{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
}
.tag-stick{font-size:11px;background:#b54747;color:#fff;padding:2px 6px;border-radius:3px;}
.tag-good{font-size:11px;background:#4a6fa5;color:#fff;padding:2px 6px;border-radius:3px;}
.tag-normal{font-size:11px;background:#eef1f4;color:#555;padding:2px 6px;border-radius:3px;}
.post-title-text{font-size:16px;color:#222;line-height:1.4;}
.post-meta{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#777;
    margin-top:auto;
}

/* 底部版主信息 */
.footer-info{
    margin-top:18px;
    padding-top:10px;
    border-top:1px dashed #e4e8ed;
    font-size:12px;
    color:#777;
}

/* 分页样式 */
.pagination{
    margin-top:20px;
    text-align:center;
    font-size:18px;
}
.pagination span{
    display:inline-block;
    margin:0 4px;
    cursor:pointer;
    color:#335588;
}
.pagination span.current{
    color:#dd2222;
    font-weight:bold;
    cursor:default;
}
.pagination span.dots{
    cursor:default;
}
</style>
</head>
<body>

<div class="user-bar">

<div class="main-container">

        <div class="online-stat">

    </div>

    <div class="content-area">
        <div style="margin-bottom:14px;text-align:right;">
    <button id="btnNewPost" style="
        padding:7px 16px;
        background:#4a6fa5;
        color:#fff;
        border:none;
        border-radius:4px;
        font-size:14px;
        cursor:pointer;
    ">发布新帖</button>
</div>

        <div class="banner">
            <img src="banner.png" alt="渭水五中校园日落">
        </div>

        <div class="alert-bar">
            快讯：中秋节通知｜食堂窗口调整｜心理部活动室开放时间更新

        <div class="search-tip" id="search-tip">未找到相关帖子</div>
        <div id="post-list"></div>

        <div class="pagination" id="page-box"></div>

        <div class="footer-info">
            版主：渭水五中宣传部
        </div>
    </div>
</div>

const searchMap = {
    "记忆碎片":"hidden_记忆碎片.html",
    "旧伤疤":"hidden_旧伤疤.html",
    "黑雾":"hidden_黑雾.html"
};

function renderPost(){
    const list = postPool[currentBoard];
    const container = document.getElementById("post-list");
    let html = "";
    list.forEach(post=>{
        let tagHtml = "";
        if(post.tag==="stick") tagHtml = `<span class="tag-stick">置顶</span>`;
        else if(post.tag==="good") tagHtml = `<span class="tag-good">精华</span>`;
        else tagHtml = `<span class="tag-normal">普通</span>`;
        const clickCode = post.href ? `onclick="window.location.href='${post.href}'"` : `onclick="window.location.href='index.html'"`;
        html += `
<div class="post-card" ${clickCode}>
    <div class="post-head">
        ${tagHtml}
        <span class="post-title-text">${post.title}</span>
    </div>
    <div class="post-meta">
        <span>作者：${post.author} ${post.time}</span>
        <span>评论：${post.comment} 阅读：${post.view}</span>
    </div>
</div>`;
    })
    container.innerHTML = html;
}

function renderPageBar(){
    const last = boardLastPage[currentBoard];
    const box = document.getElementById("page-box");
    let pageHtml = `<span onclick="location.href='index.html'">上一页</span>`;

    for(let i=1;i<=10;i++){
        if(i===1){
            pageHtml += `<span class="current" onclick="location.href='index.html'">${i}</span>`;
        }else{
            pageHtml += `<span onclick="location.href='index.html'">${i}</span>`;
        }
    }
    pageHtml += `<span class="dots">……</span>`;
    pageHtml += `<span onclick="location.href='index.html'">${last}</span>`;
    pageHtml += `<span onclick="location.href='index.html'">下一页</span>`;
    box.innerHTML = pageHtml;
}

document.querySelectorAll(".nav-item").forEach(el=>{
    el.onclick = ()=>{
        document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
        el.classList.add("active");
        currentBoard = el.dataset.board;
        renderPost();
        renderPageBar();
    }
})

document.getElementById("search-btn").addEventListener("click",()=>{
    const kw = document.getElementById("search-input").value.trim();
    if(searchMap[kw]){
        window.location.href = searchMap[kw];
    }else{
        const tip = document.getElementById("search-tip");
        tip.style.display="block";
        setTimeout(()=>tip.style.display="none",2200);
    }
});
document.getElementById("search-input").addEventListener("keydown",e=>{
    if(e.key === "Enter") document.getElementById("search-btn").click();
});

renderPost();
renderPageBar();

//发布新帖按钮
document.getElementById('btnNewPost').addEventListener('click',function(){
    alert("社区维修中，暂时无法发布新帖子");
});


</script>
